<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7a1a1a">
<title>Halu杯 符計算と点数表</title>
<style>
:root{--bg:#f7f7f5;--fg:#1c1c1c;--muted:#4f4f4f;--line:#d6d6d2;--accent:#7a1a1a;--accent-fg:#fff;--card:#fff;--card2:#f1f1ee;--soft:#faf3e3;--focus:#1a56db;--man:#f3ece0;--hit:#d4480f}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 84px}
header{border-bottom:3px solid var(--accent);margin-bottom:14px;padding-bottom:8px}
header h1{font-size:1.3rem;margin:0}
header .sub{color:var(--muted);font-size:.9rem}
.pnav{display:flex;gap:8px;margin:12px 0}
.pnav a{flex:1;text-align:center;padding:10px 6px;white-space:nowrap;border:2px solid var(--accent);border-radius:999px;text-decoration:none;font-weight:700;color:var(--accent);background:var(--card);font-size:.95rem}
.pnav a[aria-current=page]{background:var(--accent);color:var(--accent-fg)}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* 進み具合と回答済みチップ */
.prog{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.bar{flex:1;height:8px;background:var(--card2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.prog .n{font-size:.9rem;color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px;min-height:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:.9rem;font-weight:700}
.chip:hover{border-color:var(--accent)}

/* 質問カード */
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px 16px;margin:10px 0;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.q h2{font-size:1.35rem;margin:0 0 4px}
.q .lead{color:var(--muted);font-size:.93rem;margin:0 0 14px}
.opts{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:64px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 8px;font-size:1rem;text-align:center}
.opt:hover{border-color:var(--accent)}
.opt .big{font-size:1.45rem;font-weight:800;line-height:1.2}
.opt .s{font-size:.82rem;color:var(--muted);line-height:1.35}
.opt.sel{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 2px var(--accent) inset}
.opt.wide{flex-direction:row;justify-content:flex-start;gap:14px;text-align:left;padding:12px 14px}
.opt.wide .txt{display:flex;flex-direction:column}
.opt.wide .big{font-size:1.2rem}
.sep{font-size:.85rem;color:var(--muted);font-weight:700;margin:14px 0 6px}
.hint{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.92rem;margin-top:14px}
.navrow{display:flex;gap:10px;margin-top:16px}
.back,.next,.reset{border-radius:10px;font-weight:700;padding:13px 14px;font-size:1rem}
.back,.reset{background:var(--card2);border:1px solid var(--line)}
.next{flex:1;background:var(--accent);color:var(--accent-fg);border:0}

/* 牌 */
.tiles{display:flex;align-items:flex-end;gap:2px;min-width:5.6em}
.t{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:1.75em;height:2.4em;background:#fffdf6;border:1px solid #bdb8a8;border-radius:5px;box-shadow:0 2px 0 #cfc8b3;font-weight:800;line-height:1.05;font-size:1rem}
.t b{color:#1c1c1c;font-size:.95em}
.t i{font-style:normal;color:#b00020;font-size:.8em}
.t.win{border:2px dashed var(--hit);background:#fdebe3;box-shadow:none;margin-left:6px}
.t.win+.t.win{margin-left:2px}

/* 刻子・槓子のカウンター */
.mt{width:100%;border-collapse:collapse;font-size:.95rem}
.mt th,.mt td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
.mt th{font-size:.82rem;color:var(--muted);font-weight:700}
.mt td:first-child{text-align:left;font-weight:700}
.mt td:first-child .s{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.ctr{display:inline-flex;align-items:center;gap:4px}
.ctr button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:1.2rem;font-weight:800;line-height:1}
.ctr button:disabled{opacity:.35;cursor:default}
.ctr output{min-width:1.3em;font-size:1.15rem;font-weight:800}
.ctr .f{display:block;font-size:.72rem;color:var(--muted)}
.cell{display:flex;flex-direction:column;align-items:center}
.meldsum{display:flex;justify-content:space-between;font-weight:700;margin-top:10px}

/* 結果 */
.res{background:var(--accent);color:var(--accent-fg);border-radius:16px;padding:16px;text-align:center;margin:10px 0;animation:in .25s ease-out}
.res .who{font-size:1rem;opacity:.9}
.res .pts{font-size:2.3rem;font-weight:800;line-height:1.2;margin:4px 0;font-variant-numeric:tabular-nums}
.res .pts small{font-size:1rem;font-weight:700}
.res .fh{font-size:1.05rem;font-weight:700}
.res .tot{font-size:.9rem;opacity:.9}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.box h3{font-size:1rem;margin:0 0 6px;border-left:5px solid var(--accent);padding-left:10px}
.bd{width:100%;border-collapse:collapse;font-size:.95rem}
.bd td{padding:5px 4px;border-bottom:1px solid var(--line)}
.bd td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.bd tr.sum td{border-bottom:0;border-top:2px solid var(--fg);font-size:1.05rem}
.note{font-size:.9rem;color:var(--muted);margin:6px 0 0}

/* 点数表 */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.tabs button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 2px;font-weight:700;font-size:.92rem}
.tabs button[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.tw{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
table.pt{border-collapse:collapse;width:100%;table-layout:fixed;font-variant-numeric:tabular-nums}
.pt th,.pt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 2px;text-align:center;font-size:.95rem;line-height:1.25}
.pt th:last-child,.pt td:last-child{border-right:0}
.pt thead th{background:#ececE8;font-size:.9rem}
.pt tbody th{background:#f4f4f1;font-size:.9rem;width:3.2em}
.pt td.man{background:var(--man)}
.pt td.na{color:#b4b4ae}
.pt td .k,.pt td .o{display:block}
.pt td .o{font-size:.85em;color:var(--muted)}
.pt td .al{font-size:.75em}
.pt th.ax{background:#f6d9cc;color:var(--hit)}
.pt td.hit{background:var(--hit);color:#fff;font-weight:800;box-shadow:0 0 0 3px #fff inset;animation:pulse 1.2s ease-in-out 3}
.pt td.hit .o{color:#fff}
@keyframes pulse{50%{filter:brightness(1.25)}}
.lt th{text-align:left;padding-left:10px !important;width:auto !important}
.lt th .s{font-weight:400;font-size:.8rem;color:var(--muted);margin-left:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted);margin:6px 2px}
.legend .l1::before,.legend .l2::before{content:"";display:inline-block;width:.9em;height:.9em;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.legend .l1::before{background:var(--hit)}
.legend .l2::before{background:var(--man)}
footer{font-size:.82rem;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:420px){
  body{font-size:16px}
  .g4{grid-template-columns:repeat(4,1fr);gap:8px}
  .pt th,.pt td{font-size:.84rem;padding:6px 1px}
  .res .pts{font-size:2rem}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🀄 Halu杯 符計算と点数表</h1>
    <div class="sub">質問に答えていくと、点数表の中であなたの点数の欄に色がつきます。</div>
  </header>
  <nav class="pnav" aria-label="ページ切り替え"><a href="../sanka/">参加者案内</a><a href="../score/">点数報告</a><a href="../fu/" aria-current="page">点数計算</a></nav>

  <div class="prog" id="prog"><div class="bar"><i id="barI"></i></div><span class="n" id="progN"></span></div>
  <div class="chips" id="chips"></div>
  <main id="stage" aria-live="polite"></main>

  <footer>
    Mリーグ公式ルールに準拠して計算しています。<br>
    切り上げ満貫あり（4翻30符・3翻60符は満貫）。連風牌（ダブ東・ダブ南）の雀頭は2符。<br>
    数え役満はなし（11翻以上は三倍満）。役満の複合はあり。本場（1本300点）は含みません。
  </footer>
</div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const KAN = ['','一','二','三','四','五','六','七','八','九'];
const LIMITS = {
  man:  {name:'満貫',     base:2000,  han:'5翻'},
  hane: {name:'跳満',     base:3000,  han:'6・7翻'},
  bai:  {name:'倍満',     base:4000,  han:'8〜10翻'},
  san:  {name:'三倍満',   base:6000,  han:'11翻以上'},
  yaku: {name:'役満',     base:8000,  han:''},
  yaku2:{name:'ダブル役満',base:16000, han:''}
};
const FUS = [20,25,30,40,50,60,70,80,90,100,110];
const MELDS = [
  {k:'pon',   name:'ポンした刻子',   sub:'明刻',          fu:2},
  {k:'anko',  name:'手の中の刻子',   sub:'暗刻',          fu:4},
  {k:'minkan',name:'明槓',           sub:'大明槓・加槓',  fu:8},
  {k:'ankan', name:'暗槓',           sub:'',              fu:16}
];
const WAITS = {
  ryan:  {name:'両面',     fu:0, tiles:[[3],[4]],  win:[2,5], s:'2つの牌で待つ'},
  shan:  {name:'シャンポン',fu:0, tiles:[[5,5],[8,8]], win:[], s:'対子2組のどちらか'},
  kan:   {name:'カンチャン',fu:2, tiles:[[3],[5]],  win:[4], s:'間の1枚'},
  pen:   {name:'ペンチャン',fu:2, tiles:[[1],[2]],  win:[3], s:'端の1枚'},
  tanki: {name:'単騎',     fu:2, tiles:[[7]],      win:[7], s:'アタマの1枚'}
};

const S = freshState();
let tab = null;     // 点数表のタブ（'ko-ron' など）。null＝回答に合わせる
function freshState(){
  const m = {};
  MELDS.forEach(x => { m[x.k+'_s'] = 0; m[x.k+'_y'] = 0; });
  return {oya:null, han:null, agari:null, chiitoi:null, wait:null, menzen:null, head:null, melds:m, meldsDone:false, tableOnly:false};
}
const isNum = v => typeof v === 'number';
const needFu = () => isNum(S.han);
const isChiitoi = () => needFu() && S.han >= 2 && S.chiitoi === true;
const maybeFu = () => S.han === null || needFu();   // 翻が未回答の間は符の質問も数に入れる
const fuPath = () => maybeFu() && !isChiitoi();

const STEPS = [
  {id:'oya',     show:()=>true},
  {id:'han',     show:()=>true},
  {id:'agari',   show:()=>true},
  {id:'chiitoi', show:()=>S.han === null || (needFu() && S.han >= 2)},
  {id:'wait',    show:fuPath},
  {id:'menzen',  show:fuPath},
  {id:'head',    show:fuPath},
  {id:'melds',   show:fuPath},
  {id:'result',  show:()=>true}
];
let cur = 'oya';

function visible(){ return STEPS.filter(s => s.show()); }
function go(id){ cur = id; tab = null; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function nextStep(){
  const v = visible(), i = v.findIndex(s => s.id === cur);
  go(v[Math.min(i+1, v.length-1)].id);
}
function prevStep(){
  const v = visible(), i = v.findIndex(s => s.id === cur);
  if (i > 0) go(v[i-1].id);
}

/* ---------- 部品 ---------- */
function tile(n, win){ return `<span class="t${win?' win':''}"><b>${KAN[n]}</b><i>萬</i></span>`; }
function opt(key, val, big, small, extraCls){
  const sel = S[key] === val ? ' sel' : '';
  return `<button class="opt${sel}${extraCls||''}" data-k="${key}" data-v="${val}"><span class="big">${big}</span>${small?`<span class="s">${small}</span>`:''}</button>`;
}
function navRow(withNext){
  const v = visible(), first = v[0].id === cur;
  return `<div class="navrow">${first?'':'<button class="back" data-act="back">← もどる</button>'}${withNext?`<button class="next" data-act="next">${withNext}</button>`:''}</div>`;
}
function hanLabel(h){ return isNum(h) ? h+'翻' : LIMITS[h].name; }

/* ---------- 各質問 ---------- */
const VIEWS = {
  oya(){
    return `<section class="q"><h2>親ですか？ 子ですか？</h2>
      <p class="lead">アガった人がその局の親（東家）かどうか。</p>
      <div class="opts g2">${opt('oya',true,'親','東家')}${opt('oya',false,'子','南・西・北家')}</div>
      <div class="navrow"><button class="reset" data-act="table">点数表だけ見る</button></div></section>`;
  },
  han(){
    const nums = [1,2,3,4].map(h => opt('han',h,h,'翻')).join('');
    const lim = ['man','hane','bai','san'].map(k => opt('han',k,LIMITS[k].name,LIMITS[k].han)).join('')
              + opt('han','yaku','役満','') + opt('han','yaku2','ダブル役満','役満2つ');
    return `<section class="q"><h2>何翻ですか？</h2>
      <p class="lead">ドラ・赤ドラ・裏ドラも数に入れます。</p>
      <div class="opts g4">${nums}</div>
      <div class="sep">5翻以上（符の計算はいりません）</div>
      <div class="opts g3">${lim}</div>${navRow()}</section>`;
  },
  agari(){
    return `<section class="q"><h2>ロンですか？ ツモですか？</h2>
      <p class="lead">人の捨て牌でアガったらロン、自分で引いたらツモ。</p>
      <div class="opts g2">${opt('agari','ron','ロン','1人が払う')}${opt('agari','tsumo','ツモ','3人が払う')}</div>${navRow()}</section>`;
  },
  chiitoi(){
    return `<section class="q"><h2>七対子（チートイツ）ですか？</h2>
      <p class="lead">対子が7組の形。七対子は25符で決まりです。</p>
      <div class="opts g2">${opt('chiitoi',false,'いいえ','ふつうの形')}${opt('chiitoi',true,'はい','七対子')}</div>${navRow()}</section>`;
  },
  wait(){
    const list = Object.entries(WAITS).map(([k,w]) => {
      const t = w.tiles.map(g => g.map(n => tile(n)).join('')).join('<span style="width:6px"></span>')
              + w.win.map(n => tile(n,true)).join('');
      const sel = S.wait === k ? ' sel' : '';
      return `<button class="opt wide${sel}" data-k="wait" data-v="${k}"><span class="tiles">${t}</span>
        <span class="txt"><span class="big">${w.name}${w.fu?' <small style="font-size:.8rem;color:var(--hit)">+2符</small>':''}</span><span class="s">${w.s}</span></span></button>`;
    }).join('');
    return `<section class="q"><h2>待ちの形は？</h2>
      <p class="lead">点線の牌がアガリ牌です。</p>
      <div class="opts">${list}</div>
      <div class="hint">2通りに取れるときは、符が高くなる方（カンチャン・ペンチャン・単騎）を選べます。</div>${navRow()}</section>`;
  },
  menzen(){
    return `<section class="q"><h2>鳴いていますか？</h2>
      <p class="lead">ポン・チー・明槓をしているか。</p>
      <div class="opts g2">${opt('menzen',true,'鳴いていない','門前（暗槓だけも含む）')}${opt('menzen',false,'鳴いている','ポン・チー・明槓あり')}</div>${navRow()}</section>`;
  },
  head(){
    return `<section class="q"><h2>雀頭（アタマ）は？</h2>
      <p class="lead">対子1組のアタマの牌の種類。</p>
      <div class="opts g2">${opt('head','none','符なし','数牌・関係ない風牌')}${opt('head','yaku','役牌 +2符','白發中・場風・自風')}</div>
      <div class="hint">ダブ東・ダブ南のアタマも2符です（Mリーグルール）。</div>${navRow()}</section>`;
  },
  melds(){
    const cnt = meldCount();
    const rows = MELDS.map(m => {
      const c = y => {
        const key = m.k + (y?'_y':'_s'), v = S.melds[key], fu = m.fu * (y?2:1);
        return `<td><div class="cell"><span class="ctr"><button data-m="${key}" data-d="-1" ${v<=0?'disabled':''} aria-label="減らす">−</button><output>${v}</output><button data-m="${key}" data-d="1" ${cnt>=4?'disabled':''} aria-label="増やす">＋</button></span><span class="f">1つ ${fu}符</span></div></td>`;
      };
      return `<tr><td>${m.name}<span class="s">${m.sub}</span></td>${c(false)}${c(true)}</tr>`;
    }).join('');
    const ronShan = S.agari === 'ron' && S.wait === 'shan';
    return `<section class="q"><h2>刻子・槓子はありますか？</h2>
      <p class="lead">同じ牌3枚（刻子）・4枚（槓子）の数を入れます。順子（連続した3枚）は0符なので数えません。</p>
      <table class="mt"><thead><tr><th></th><th>2〜8の牌</th><th>1・9・字牌</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="meldsum"><span>刻子・槓子の符</span><span>${meldFu()}符</span></div>
      ${ronShan?'<div class="hint"><b>シャンポン待ちのロン</b>：ロンで完成した刻子は「ポンした刻子」に数えます。</div>':''}
      ${navRow(cnt ? '点数を見る →' : 'ない（点数を見る） →')}</section>`;
  },
  result(){
    if (S.tableOnly || !complete()) return tableHtml(null);
    return resultHtml() + tableHtml(hitKey());
  }
};

/* ---------- 計算 ---------- */
function meldCount(){ return Object.values(S.melds).reduce((a,b)=>a+b,0); }
function meldFu(){
  let f = 0;
  MELDS.forEach(m => { f += S.melds[m.k+'_s']*m.fu + S.melds[m.k+'_y']*m.fu*2; });
  return f;
}
function complete(){
  if (S.oya===null || S.han===null || S.agari===null) return false;
  if (!needFu()) return true;
  if (S.han >= 2 && S.chiitoi === null) return false;
  if (isChiitoi()) return true;
  return S.wait!==null && S.menzen!==null && S.head!==null && S.meldsDone;
}
function calcFu(){
  const tsumo = S.agari === 'tsumo';
  if (isChiitoi()) return {fu:25, items:[['七対子',25]], notes:['七対子は25符で固定です（切り上げません）。']};
  const w = WAITS[S.wait], headFu = S.head === 'yaku' ? 2 : 0, mf = meldFu();
  const pinfu = S.menzen && S.wait === 'ryan' && headFu === 0 && meldCount() === 0;
  const notes = [];
  if (pinfu && tsumo){
    if (S.han < 2) notes.push('平和とツモで2翻以上のはずです。翻数を確かめてください。');
    notes.push('平和ツモはツモの2符をつけず、20符です。');
    return {fu:20, items:[['副底',20]], notes};
  }
  const items = [['副底',20]];
  if (S.menzen && !tsumo) items.push(['門前でロン',10]);
  if (tsumo) items.push(['ツモ',2]);
  if (w.fu) items.push([w.name+'待ち',w.fu]);
  if (headFu) items.push(['役牌のアタマ',2]);
  MELDS.forEach(m => {
    [['_s','2〜8',1],['_y','1・9・字',2]].forEach(([sf,lab,mul]) => {
      const n = S.melds[m.k+sf];
      if (n) items.push([`${m.name}（${lab}）×${n}`, n*m.fu*mul]);
    });
  });
  const raw = items.reduce((a,x)=>a+x[1],0);
  let fu = Math.ceil(raw/10)*10;
  if (raw !== fu) notes.push(`${raw}符 → 1の位を切り上げて ${fu}符。`);
  if (fu === 20 && !tsumo){ fu = 30; notes.push('鳴いた平和の形（符が20符）のロンは30符にします。'); }
  if (pinfu && !tsumo) notes.push('平和のロンは30符です。');
  if (fu > 110) fu = 110;
  return {fu, raw, items, notes};
}
function baseOf(han, fu){
  if (!isNum(han)) return LIMITS[han].base;
  const b = fu * Math.pow(2, han + 2);
  return b >= 1920 ? 2000 : b;   // 4翻30符・3翻60符は切り上げ満貫
}
const up = x => Math.ceil(x/100)*100;
function pay(base, oya, tsumo){
  if (!tsumo) return {ron: up(base*(oya?6:4))};
  if (oya) return {all: up(base*2)};
  return {ko: up(base), oyaP: up(base*2)};
}
function exists(han, fu, tsumo){
  if (fu === 20 && (!tsumo || han === 1)) return false;
  if (fu === 25 && (han === 1 || (tsumo && han === 2))) return false;
  return true;
}
const fmt = n => n.toLocaleString('ja-JP');
function hitKey(){
  const k = (S.oya?'oya':'ko') + '-' + S.agari;
  if (!isNum(S.han)) return {tab:k, id:'l-'+S.han};
  return {tab:k, id:`c-${calcFu().fu}-${S.han}`};
}

/* ---------- 結果 ---------- */
function resultHtml(){
  const tsumo = S.agari === 'tsumo';
  let fu = null, fuBox = '';
  if (isNum(S.han)){
    const r = calcFu(); fu = r.fu;
    const rows = r.items.map(([l,f]) => `<tr><td>${l}</td><td>${f}符</td></tr>`).join('');
    fuBox = `<div class="box"><h3>符の内訳</h3><table class="bd">${rows}<tr class="sum"><td>合計</td><td>${fu}符</td></tr></table>
      ${r.notes.map(n=>`<p class="note">${n}</p>`).join('')}</div>`;
  }
  const base = baseOf(S.han, fu), p = pay(base, S.oya, tsumo);
  let pts, tot = '';
  if (p.ron != null) pts = `${fmt(p.ron)}<small>点</small>`;
  else if (p.all != null){ pts = `${fmt(p.all)}<small>点オール</small>`; tot = `子3人が ${fmt(p.all)}点ずつ（合計 ${fmt(p.all*3)}点）`; }
  else { pts = `${fmt(p.ko)}<small>・</small>${fmt(p.oyaP)}<small>点</small>`; tot = `子が ${fmt(p.ko)}点ずつ・親が ${fmt(p.oyaP)}点（合計 ${fmt(p.ko*2+p.oyaP)}点）`; }
  const man = isNum(S.han) && base === 2000 ? '（満貫）' : '';
  const fh = isNum(S.han) ? `${fu}符 ${S.han}翻${man}` : hanLabel(S.han) + (LIMITS[S.han].han ? `（${LIMITS[S.han].han}）` : '');
  return `<div class="res"><div class="who">${S.oya?'親':'子'}の${tsumo?'ツモ':'ロン'}</div>
    <div class="pts">${pts}</div><div class="fh">${fh}</div>${tot?`<div class="tot">${tot}</div>`:''}</div>
    <div class="navrow" style="margin-top:0"><button class="back" data-act="back">← もどる</button><button class="reset" data-act="reset" style="flex:1">最初からやり直す</button></div>
    ${fuBox}`;
}

/* ---------- 点数表 ---------- */
const TABS = [['ko-ron','子 ロン'],['ko-tsumo','子 ツモ'],['oya-ron','親 ロン'],['oya-tsumo','親 ツモ']];
function cellHtml(p){
  if (p.ron != null) return String(p.ron);
  if (p.all != null) return `${p.all}<span class="al">オール</span>`;
  return `<span class="k">${p.ko}</span><span class="o">${p.oyaP}</span>`;
}
function tableHtml(hit){
  const t = tab || (hit ? hit.tab : 'ko-ron');
  const oya = t.startsWith('oya'), tsumo = t.endsWith('tsumo');
  const show = hit && hit.tab === t ? hit.id : null;
  const hitFu = show && show.startsWith('c-') ? show.split('-')[1] : null;
  const hitHan = show && show.startsWith('c-') ? show.split('-')[2] : null;
  const tabs = TABS.map(([k,l]) => `<button data-tab="${k}" aria-pressed="${k===t}">${l}</button>`).join('');
  let body = '';
  FUS.forEach(fu => {
    let tds = '';
    for (let h = 1; h <= 4; h++){
      const id = `c-${fu}-${h}`;
      if (!exists(h, fu, tsumo)){ tds += `<td class="na" id="${id}">—</td>`; continue; }
      const b = baseOf(h, fu);
      const cls = [b === 2000 ? 'man' : '', id === show ? 'hit' : ''].join(' ').trim();
      tds += `<td class="${cls}" id="${id}">${cellHtml(pay(b, oya, tsumo))}</td>`;
    }
    body += `<tr><th class="${String(fu)===hitFu?'ax':''}">${fu}符</th>${tds}</tr>`;
  });
  const heads = [1,2,3,4].map(h => `<th class="${String(h)===hitHan?'ax':''}">${h}翻</th>`).join('');
  const lrows = Object.entries(LIMITS).map(([k,L]) => {
    const id = 'l-'+k;
    return `<tr><th class="${id===show?'ax':''}">${L.name}<span class="s">${L.han}</span></th><td class="${id===show?'hit':''}" id="${id}">${cellHtml(pay(L.base, oya, tsumo))}</td></tr>`;
  }).join('');
  const lead = hit ? (show ? '色がついた欄があなたの点数です。' : '回答と違う表を表示中です。') : '見たい表を選んでください。';
  const tsNote = tsumo && !oya ? '<span>上＝子1人の払い／下＝親の払い</span>' : '';
  return `<div class="box"><h3>点数表</h3><p class="note" style="margin:0 0 4px">${lead}</p>
    <div class="tabs" role="group" aria-label="表の切り替え">${tabs}</div>
    <div class="legend">${hit?'<span class="l1">あなたの点数</span>':''}<span class="l2">満貫</span>${tsNote}</div>
    <div class="tw"><table class="pt"><thead><tr><th></th>${heads}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="tw" style="margin-top:10px"><table class="pt lt"><tbody>${lrows}</tbody></table></div>
    ${S.tableOnly || !hit ? '<div class="navrow"><button class="next" data-act="reset">質問に答えて計算する</button></div>' : ''}</div>`;
}

/* ---------- 描画 ---------- */
function render(){
  const v = visible(), i = v.findIndex(s => s.id === cur);
  const isResult = cur === 'result';
  $('#prog').hidden = isResult;
  $('#barI').style.width = ((i) / (v.length-1) * 100) + '%';
  $('#progN').textContent = `質問 ${i+1} / ${v.length-1}`;
  // 回答済みチップ（押すとその質問へ戻る）
  const chips = [];
  if (!S.tableOnly){
    if (S.oya !== null) chips.push(['oya', S.oya?'親':'子']);
    if (S.han !== null) chips.push(['han', hanLabel(S.han)]);
    if (S.agari !== null) chips.push(['agari', S.agari==='ron'?'ロン':'ツモ']);
    if (isChiitoi()) chips.push(['chiitoi','七対子']);
    if (fuPath()){
      if (S.wait) chips.push(['wait', WAITS[S.wait].name+'待ち']);
      if (S.menzen !== null) chips.push(['menzen', S.menzen?'門前':'鳴きあり']);
      if (S.head) chips.push(['head', S.head==='yaku'?'役牌アタマ':'アタマ符なし']);
      if (S.meldsDone) chips.push(['melds', `刻子・槓子 ${meldFu()}符`]);
    }
  }
  $('#chips').innerHTML = chips.filter(c => c[0] !== cur).map(([k,l]) => `<button class="chip" data-go="${k}" title="この質問に戻る">${l}</button>`).join('');
  $('#stage').innerHTML = VIEWS[cur]();
  if (isResult){
    const h = document.querySelector('td.hit');
    if (h && !tab) setTimeout(() => h.scrollIntoView({block:'center', behavior:'smooth'}), 350);
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.k){
    const k = b.dataset.k, raw = b.dataset.v;
    let v = raw;
    if (raw === 'true') v = true; else if (raw === 'false') v = false; else if (/^\d+$/.test(raw)) v = Number(raw);
    S[k] = v;
    // 七対子なら待ち以降は関係ない。はいを取り消したら続きから聞く
    nextStep(); return;
  }
  if (b.dataset.m){
    const key = b.dataset.m, d = Number(b.dataset.d);
    S.melds[key] = Math.max(0, S.melds[key] + d);
    render(); return;
  }
  if (b.dataset.go){ go(b.dataset.go); return; }
  if (b.dataset.tab){ tab = b.dataset.tab; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const act = b.dataset.act;
  if (act === 'back') prevStep();
  else if (act === 'next'){ if (cur === 'melds') S.meldsDone = true; nextStep(); }
  else if (act === 'reset'){ Object.assign(S, freshState()); go('oya'); }
  else if (act === 'table'){ Object.assign(S, freshState()); S.tableOnly = true; go('result'); }
});

render();
})();
</script>
</body>
</html>
