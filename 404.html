<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7a1a1a">
<title>Halu杯（公開終了）</title>
<!-- 2026-11-01 に順位表（kuji/）だけ残して片付けた。消したページを開くと GitHub Pages がこのページを返す（どの階層でも出るのでリンクは絶対パス） -->
<style>
:root{--bg:#f7f7f5;--fg:#1c1c1c;--muted:#4f4f4f;--line:#d6d6d2;--accent:#7a1a1a;--accent-fg:#ffffff;--card:#ffffff;--focus:#1a56db}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8}
main{max-width:640px;margin:0 auto;padding:48px 16px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:10px;padding:20px 18px}
h1{font-size:1.2rem;margin:0 0 8px}
p{margin:0;color:var(--muted)}
a.go{display:block;margin-top:16px;padding:12px 6px;text-align:center;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:700;text-decoration:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>このページの公開は終了しました</h1>
    <p>第20回 Halu杯は、2026年10月24日（土）に終了しました。</p>
    <a class="go" href="/halu-cup/kuji/">順位表を見る</a>
  </div>
</main>
</body>
</html>
