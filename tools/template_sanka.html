<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7a1a1a">
<title>第20回 Halu杯 参加者案内</title>
<style>
:root{--bg:#f7f7f5;--fg:#1c1c1c;--muted:#4f4f4f;--line:#d6d6d2;--accent:#7a1a1a;--accent-fg:#ffffff;--card:#ffffff;--card2:#f1f1ee;--soft:#faf3e3;--focus:#1a56db}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:17px;line-height:1.8;-webkit-text-size-adjust:100%}
a{color:var(--accent);text-decoration:underline}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 84px}
.hero{margin:0 -16px 14px;background:#111}
.hero img{display:block;width:100%;max-height:78vh;object-fit:contain;margin:0 auto}
header{border-bottom:3px solid var(--accent);margin-bottom:14px;padding-bottom:10px}
header h1{font-size:1.35rem;margin:0;line-height:1.4}
header .sub{color:var(--muted);font-size:.9rem}
.lead{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.98rem}
h2{font-size:1.15rem;margin:34px 0 12px;padding:10px 14px;background:var(--accent);color:var(--accent-fg);border-radius:8px;position:sticky;top:0;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.25)}
h3{font-size:1.08rem;margin:24px 0 8px;border-left:5px solid var(--accent);padding-left:10px}
p{margin:8px 0}
strong{color:var(--accent);font-weight:700}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;background:var(--card);font-size:.98rem}
th,td{border-bottom:1px solid var(--line);padding:10px 10px;text-align:left;vertical-align:top;line-height:1.55}
td + td, th + th{border-left:1px solid var(--line)}
td:first-child,th:first-child{white-space:nowrap}
tr:nth-child(even) td{background:var(--card2)}
th{background:#ececE8;white-space:nowrap;font-weight:700}
ul,ol{padding-left:1.5em;margin:8px 0}
li{margin:5px 0}
code{background:var(--card2);padding:1px 5px;border-radius:4px}
a.xref{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
tr.pro td,table td.pro{background:#fbe3c4}
.legend{font-size:.9rem;color:var(--muted);margin:6px 0 4px}
.pro-sw{display:inline-block;width:1em;height:1em;background:#fbe3c4;border:1px solid var(--line);border-radius:3px;vertical-align:-2px}
nav.toc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:14px 0}
nav.toc a{display:inline-block;margin:4px 6px 4px 0;padding:8px 12px;font-size:.95rem;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:999px;text-decoration:none}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin:12px 0}
.flow span{background:var(--card);border:2px solid var(--accent);border-radius:10px;padding:12px;font-weight:bold;text-align:center}
.flow i{font-style:normal;font-weight:bold;color:var(--accent);text-align:center;transform:rotate(90deg);line-height:1;font-size:1.2rem}
@media (min-width:560px){.flow{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}.flow i{transform:none}}
.map{display:inline-block;margin-top:4px}
.top{position:fixed;right:12px;bottom:12px;background:var(--accent);color:var(--accent-fg);border-radius:50%;width:48px;height:48px;font-size:1.3rem;font-weight:bold;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pnav{display:flex;gap:8px;margin:12px 0}
.pnav a{flex:1;text-align:center;padding:10px 12px;border:2px solid var(--accent);border-radius:999px;text-decoration:none;font-weight:700;color:var(--accent);background:var(--card)}
.pnav a[aria-current=page]{background:var(--accent);color:var(--accent-fg)}
.pick{background:var(--card);border:2px solid var(--accent);border-radius:10px;padding:10px 12px;margin:12px 0}
.pick label{display:block;font-weight:700;margin-bottom:6px}
.pick select{width:100%;font-size:1.15rem;padding:12px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--fg)}
.pick .note{font-size:.9rem;color:var(--muted);margin-top:6px}
td.me{background:var(--soft)!important;font-weight:700;color:var(--accent);outline:2px solid var(--accent);outline-offset:-2px}
.nm{display:block;font-size:.78rem;color:var(--muted);font-weight:400;line-height:1.25;white-space:nowrap}
.party{background:var(--card);border:2px solid var(--accent);border-radius:10px;padding:12px;margin:12px 0}
.party label{display:block;font-weight:700;margin:8px 0 4px}
.party input[type=text],.party select{width:100%;font-size:1.1rem;padding:10px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--fg)}
.party .opt{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font-weight:400}
.party .opt input{width:24px;height:24px;margin-top:2px;flex:0 0 auto;accent-color:var(--accent)}
.party .opt b{color:var(--accent);margin-right:4px}
.party button{margin-top:10px;width:100%;font-size:1.05rem;padding:12px;background:var(--accent);color:var(--accent-fg);font-weight:700;border:0;border-radius:8px}
.party button.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line);font-weight:400;margin-top:6px}
.party .st{font-size:.95rem;margin-top:8px;color:var(--muted)}
.party .st.ok{color:#146c2e;font-weight:700}
.party .st.ng{color:#b00020;font-weight:700}
.party input[hidden]{display:none}
.roster{margin:10px 0}
.roster .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roster .tw{margin:0}
.roster td,.roster th{padding:8px 8px}
.roster .st{color:var(--muted);font-size:.95rem}
@media (max-width:420px){.roster .cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><img src="../poster.jpg" alt="第20回 Halu杯 ポスター"></div>
  <header>
    <h1>第20回 Halu杯 参加者案内</h1>
    <div class="sub">2026年10月24日（土）麻雀First。最終更新: __UPDATED__</div>
  </header>
  <nav class="pnav" aria-label="ページ切り替え"><a href="../sanka/" aria-current="page">参加者案内</a><a href="../score/">点数報告</a></nav>
  <p class="lead">会場の地図: <a class="map" href="https://www.google.com/maps/search/?api=1&query=%E7%A6%8F%E5%B2%A1%E5%B8%82%E4%B8%AD%E5%A4%AE%E5%8C%BA%E4%BB%8A%E6%B3%892-4-35" target="_blank" rel="noopener">福岡市中央区今泉2-4-35 今泉セントラルビル5F（Googleマップで開く）</a></p>
  <p class="lead">半荘が終わったら <a href="../score/">点数報告ページ</a> から自分の点数を送ってください。</p>
  <nav class="toc" id="toc"></nav>
  <main id="content">__BODY__</main>
  <nav class="pnav" aria-label="ページ切り替え"><a href="../sanka/" aria-current="page">参加者案内</a><a href="../score/">点数報告</a></nav>
  <a class="top" href="#" title="上へ">↑</a>
</div>
<script src="../score/config.js"></script>
<script>
const c = document.getElementById('content'), toc = document.getElementById('toc');
c.querySelectorAll('h2').forEach(h => { const a = document.createElement('a'); a.href = '#' + h.id; a.textContent = h.textContent; toc.appendChild(a); });
// 受け口（点数報告と同じ GAS）。出席者一覧（P番号→名前）は受け口にだけある＝このリポにはファイルとして置かない
const API = (window.HALU_API || '').trim();
const NAMES = ['本田プロ', 'ゆうこママ'].concat(Array.from({ length: 30 }, (_, i) => 'P' + (i + 1)));
const PNOS = NAMES.slice(2);
let ROSTER = {};
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }
function label(n) { return ROSTER[n] || n; }   // 名前が入っていれば名前だけ（P番号は出さない）
async function fetchData() {
  if (!API) throw new Error('noapi');
  const r = await fetch(API + '?t=' + Date.now(), { cache: 'no-store' }); const j = await r.json(); if (!j.ok) throw new Error('bad');
  ROSTER = j.data.roster || {};
  return j.data;
}
const onRoster = [];   // 一覧が届いたら呼ぶ
// 8章（対戦表）: プレイヤーNoを選ぶと、その人のいる行だけに絞る
(function () {
  const h2 = [...c.querySelectorAll('h2')].find(h => /対戦表/.test(h.textContent)); if (!h2) return;
  const tables = []; for (let el = h2.nextElementSibling; el && el.tagName !== 'H2'; el = el.nextElementSibling) tables.push(...el.querySelectorAll('table'));
  if (!tables.length) return;
  const box = document.createElement('div'); box.className = 'pick';
  box.innerHTML = '<label for="pick">自分のプレイヤーNoを選ぶと、自分の卓だけ表示します</label><select id="pick"><option value="">全員の表を見る</option>' + NAMES.map(n => '<option value="' + n + '">' + n + '</option>').join('') + '</select><div class="note"></div>';
  const first = h2.nextElementSibling && h2.nextElementSibling.tagName === 'P' ? h2.nextElementSibling : h2;
  first.insertAdjacentElement('afterend', box);
  const sel = box.querySelector('select'), note = box.querySelector('.note');
  const key = td => td.dataset.p || td.textContent.trim();   // 名前を添えた後も P番号で判定する
  function apply() {
    const v = sel.value;
    tables.forEach(t => t.querySelectorAll('tr').forEach(tr => {
      const tds = [...tr.querySelectorAll('td')]; if (!tds.length) return;
      const hit = tds.some(td => key(td) === v);
      tr.hidden = !!v && !hit;
      tds.forEach(td => td.classList.toggle('me', !!v && key(td) === v));
    }));
    note.textContent = v ? label(v) + ' の卓だけ表示中。表の色つきが自分の席です' : '';
    try { localStorage.setItem('halu:pick', v); } catch (e) {}
  }
  sel.addEventListener('change', apply);
  try { const v = localStorage.getItem('halu:pick'); if (v && NAMES.includes(v)) sel.value = v; } catch (e) {}
  apply();
  // 一覧が届いたら、表の P番号の下に名前を添える（仮のNo）
  onRoster.push(() => {
    sel.querySelectorAll('option').forEach(o => { if (o.value) o.textContent = label(o.value); });
    tables.forEach(t => t.querySelectorAll('td').forEach(td => { const p = key(td); if (/^P\d+$/.test(p) && ROSTER[p]) { td.dataset.p = p; td.textContent = ROSTER[p]; } }));
    if (Object.keys(ROSTER).length && !box.querySelector('.st')) box.insertAdjacentHTML('beforeend', '<p class="st">名前が入っている人は名前で表示しています（席は仮のプレイヤーNoによるもの。正式なNoは別途）</p>');
    apply();
  });
})();
// 8章（出席者一覧）: 受け口の一覧を表にする（仮のプレイヤーNo）
(function () {
  const box = document.getElementById('roster'); if (!box) return;
  box.innerHTML = '<p class="st">出席者一覧を読み込み中…</p>';
  onRoster.push(() => {
    const rows = PNOS.filter(p => ROSTER[p]);
    if (!rows.length) { box.innerHTML = '<p class="st">出席者一覧はまだ登録されていません。</p>'; return; }
    const half = Math.ceil(rows.length / 2);
    const tbl = list => '<div class="tw"><table><tr><th>No</th><th>名前</th></tr>' + list.map(p => '<tr><td>' + p + '</td><td>' + esc(ROSTER[p]) + '</td></tr>').join('') + '</table></div>';
    box.innerHTML = '<div class="cols">' + tbl(rows.slice(0, half)) + tbl(rows.slice(half)) + '</div>';
  });
})();
// 7章（打ち上げ）: 希望日の回答フォーム。名前は出席者一覧から選ぶ（受け口に名前ごとに保存）
(function () {
  const box = document.getElementById('party'); if (!box) return;
  const LABEL = { '1': '大会当日希望。翌週でも可', '2': '翌週土曜希望。当日でも可', '3': '大会当日だけ希望。入れなければお食事券', '4': 'お食事券希望（打ち上げには参加しない）' };
  const MARK = { '1': '①', '2': '②', '3': '③', '4': '④' };
  const CH = ['1', '2', '3', '4'];
  box.innerHTML = '<label for="pname">お名前（一覧から選ぶ）</label><select id="pname"><option value="">選んでください</option><option value="*">一覧にない（下に入力）</option></select>'
    + '<input id="pname2" type="text" maxlength="20" autocomplete="off" placeholder="LINEの名前など、幹部に分かる呼び名" hidden>'
    + '<label>希望</label>' + CH.map(v => '<label class="opt"><input type="radio" name="pch" value="' + v + '"><span><b>' + MARK[v] + '</b>' + LABEL[v] + '</span></label>').join('')
    + '<button type="button" id="psend">この内容で回答する</button><button type="button" class="ghost" id="pdel">回答を消す</button><div class="st" id="pst" aria-live="polite"></div>';
  const sel = box.querySelector('#pname'), free = box.querySelector('#pname2'), st = box.querySelector('#pst');
  let PARTY = {};
  function say(msg, cls) { st.textContent = msg; st.className = 'st' + (cls ? ' ' + cls : ''); }
  function fmt(ts) { return ts ? ts.slice(5, 16).replace('-', '/') : ''; }
  function who() { return sel.value === '*' ? { name: free.value.trim(), no: '' } : { name: sel.value ? ROSTER[sel.value] || '' : '', no: sel.value }; }
  function fillNames() {
    const keep = sel.value;
    [...sel.options].forEach(o => { if (o.value && o.value !== '*') o.remove(); });
    PNOS.filter(p => ROSTER[p]).forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = label(p); sel.insertBefore(o, sel.lastElementChild); });
    if (keep && [...sel.options].some(o => o.value === keep)) sel.value = keep;
    else { try { const v = localStorage.getItem('halu:pname'); if (v && [...sel.options].some(o => o.value === v)) sel.value = v; else { const pk = localStorage.getItem('halu:pick'); if (pk && ROSTER[pk]) sel.value = pk; } } catch (e) {} }
    free.hidden = sel.value !== '*';
    showMine();
  }
  function showMine() {
    const w = who(), me = w.name ? PARTY[w.name] : null;
    box.querySelectorAll('input[name=pch]').forEach(x => { x.checked = false; });
    const cnt = { '1': 0, '2': 0, '3': 0, '4': 0 }; Object.values(PARTY).forEach(v => { if (cnt[v.choice] !== undefined) cnt[v.choice]++; });
    const tot = '（いまの回答: ' + CH.map(v => MARK[v] + cnt[v] + '人').join(' ') + '）';
    if (me) { const r = box.querySelector('input[name=pch][value="' + me.choice + '"]'); if (r) r.checked = true; say('回答済み: ' + MARK[me.choice] + ' ' + LABEL[me.choice] + '（' + fmt(me.ts) + '）' + tot, 'ok'); }
    else say((w.name ? 'まだ回答がありません ' : '') + tot);
  }
  async function load() {
    try { const d = await fetchData(); PARTY = d.party || {}; onRoster.forEach(f => f()); }
    catch (e) { say(e.message === 'noapi' ? '受け口（API）が未設定のため、いまは送れません' : '受け口につながりません。電波のよい所でもう一度開いてください', 'ng'); }
  }
  async function send(choice) {
    const w = who(); if (!w.name) { say(sel.value === '*' ? 'お名前を入れてください' : 'お名前を選んでください', 'ng'); (sel.value === '*' ? free : sel).focus(); return; }
    if (choice === undefined) { const r = box.querySelector('input[name=pch]:checked'); if (!r) { say('①〜④のどれかを選んでください', 'ng'); return; } choice = r.value; }
    try { localStorage.setItem('halu:pname', sel.value); } catch (e) {}
    say('送信中…');
    try {
      const r = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'party', name: w.name, no: w.no, choice }) });
      const j = await r.json(); if (!j.ok) throw new Error(j.error || 'ng');
      PARTY = j.party || {}; showMine(); if (!choice) say('回答を消しました');
    } catch (e) { say('送れませんでした。電波のよい所でもう一度お試しください', 'ng'); }
  }
  box.querySelector('#psend').addEventListener('click', () => send());
  box.querySelector('#pdel').addEventListener('click', () => { if (confirm('回答を消しますか？')) send(''); });
  sel.addEventListener('change', () => { free.hidden = sel.value !== '*'; if (sel.value === '*') free.focus(); showMine(); });
  free.addEventListener('change', showMine);
  onRoster.push(fillNames);
  load();
})();
</script>
</body>
</html>
