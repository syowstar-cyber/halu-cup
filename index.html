<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Halu杯 幹部用</title>
<style>
:root{--bg:#f7f6f2;--fg:#1f1f1f;--muted:#6b6b6b;--line:#ddd8cc;--accent:#8a1c1c;--card:#fff;--soft:#f1ede2;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:15px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 64px}
header{border-bottom:2px solid var(--accent);margin-bottom:12px;padding-bottom:8px}
header h1{font-size:1.35rem;margin:0}
header .sub{color:var(--muted);font-size:.85rem}
h2{font-size:1.15rem;margin:32px 0 8px;padding:6px 10px;background:var(--accent);color:#fff;border-radius:6px}
h3{font-size:1rem;margin:20px 0 6px;border-left:4px solid var(--accent);padding-left:8px}
p{margin:6px 0}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;background:var(--card);font-size:.92rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft);white-space:nowrap}
pre.box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;font-size:.9rem;line-height:1.5;white-space:pre;font-family:ui-monospace,"Consolas","Noto Sans Mono CJK JP",monospace}
ul,ol{padding-left:1.4em;margin:6px 0}
li{margin:2px 0}
ul.todo{list-style:none;padding-left:0}
ul.todo li label{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:4px 0}
ul.todo input{margin-top:5px;flex:0 0 auto}
ul.todo input:checked + span{color:var(--muted);text-decoration:line-through}
.warn{color:#b00020;font-weight:bold}
details{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:8px 0}
summary{cursor:pointer;font-weight:bold}
code{background:var(--soft);padding:1px 4px;border-radius:3px}
nav.toc{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:12px 0}
nav.toc a{display:inline-block;margin:2px 10px 2px 0;font-size:.9rem;color:var(--accent);text-decoration:none}
#gate{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
#gate h1{font-size:1.2rem;margin:0 0 6px}
#gate p{color:var(--muted);font-size:.9rem}
#gate input{width:100%;font-size:1.1rem;padding:10px;border:1px solid var(--line);border-radius:6px;margin:10px 0}
#gate button{width:100%;font-size:1rem;padding:10px;background:var(--accent);color:#fff;border:0;border-radius:6px}
#msg{color:#b00020;min-height:1.4em;font-size:.9rem}
.top{position:fixed;right:12px;bottom:12px;background:var(--accent);color:#fff;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;text-decoration:none;opacity:.85}
</style>
</head>
<body>

  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(B.salt), iterations:B.iter}, base, 512));
  const aesKey = await crypto.subtle.importKey('raw', bits.slice(0,32), {name:'AES-CBC'}, false, ['decrypt']);
  const macKey = await crypto.subtle.importKey('raw', bits.slice(32,64), {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  const iv = b64(B.iv), ct = b64(B.ct);
  const joined = new Uint8Array(iv.length + ct.length); joined.set(iv); joined.set(ct, iv.length);
  const ok = await crypto.subtle.verify('HMAC', macKey, b64(B.mac), joined);
  if(!ok) throw new Error('bad');
  const plain = await crypto.subtle.decrypt({name:'AES-CBC', iv}, aesKey, ct);
  return new TextDecoder().decode(plain);
}
function show(htmlText){
  const c = document.getElementById('content');
  c.innerHTML = htmlText;
  const toc = document.getElementById('toc');
  c.querySelectorAll('h2').forEach(h => { const a = document.createElement('a'); a.href = '#' + h.id; a.textContent = h.textContent; toc.appendChild(a); });
  c.querySelectorAll('ul.todo input').forEach(cb => {
    const k = 'halu:' + cb.dataset.k;
    try { cb.checked = localStorage.getItem(k) === '1'; } catch(e){}
    cb.addEventListener('change', () => { try { localStorage.setItem(k, cb.checked ? '1' : '0'); } catch(e){} });
  });
  document.getElementById('gate').hidden = true;
  document.getElementById('page').hidden = false;
}
