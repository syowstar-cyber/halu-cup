<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7a1a1a">
<title>Halu杯 幹部用</title>
<style>
/* 配色は読みやすさ優先: 明るい地に濃い文字（本文コントラスト比 約14:1）。強調色は臙脂1色だけ */
:root{--bg:#f7f7f5;--fg:#1c1c1c;--muted:#4f4f4f;--line:#d6d6d2;--accent:#7a1a1a;--accent-fg:#ffffff;--card:#ffffff;--card2:#f1f1ee;--soft:#faf3e3;--focus:#1a56db}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:17px;line-height:1.8;-webkit-text-size-adjust:100%}
a{color:var(--accent);text-decoration:underline}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 84px}
.hero{margin:0 -16px 14px;position:relative;background:#111}
.hero img{display:block;width:100%;max-height:70vh;object-fit:contain;margin:0 auto}
.hero .badge{position:absolute;left:12px;top:12px;background:var(--accent);color:var(--accent-fg);font-weight:bold;font-size:.85rem;padding:5px 12px;border-radius:999px;letter-spacing:.05em}
header{border-bottom:3px solid var(--accent);margin-bottom:14px;padding-bottom:10px}
header h1{font-size:1.35rem;margin:0;line-height:1.4;color:var(--fg)}
header .sub{color:var(--muted);font-size:.9rem}
.lead{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.98rem}
h2{font-size:1.15rem;margin:34px 0 12px;padding:10px 14px;background:var(--accent);color:var(--accent-fg);border-radius:8px;position:sticky;top:0;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.25)}
h3{font-size:1.08rem;margin:24px 0 8px;border-left:5px solid var(--accent);padding-left:10px;color:var(--fg)}
p{margin:8px 0}
strong{color:var(--accent);font-weight:700}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;background:var(--card);font-size:.98rem}
th,td{border-bottom:1px solid var(--line);padding:10px 10px;text-align:left;vertical-align:top;line-height:1.55}
td + td, th + th{border-left:1px solid var(--line)}
td:first-child,th:first-child{white-space:nowrap}
tr:nth-child(even) td{background:var(--card2)}
th{background:#ececE8;color:var(--fg);white-space:nowrap;font-weight:700}
pre.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-size:.98rem;line-height:1.6;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,"Consolas","Noto Sans Mono CJK JP",monospace}
ul,ol{padding-left:1.5em;margin:8px 0}
li{margin:5px 0}
ul.todo{list-style:none;padding-left:0}
ul.todo li label{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
ul.todo input{margin-top:4px;flex:0 0 auto;width:24px;height:24px;accent-color:var(--accent)}
ul.todo input:checked + span{color:var(--muted);text-decoration:line-through}
.warn{color:#b00020;font-weight:bold}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0}
summary{cursor:pointer;font-weight:bold}
code{background:var(--card2);padding:1px 5px;border-radius:4px}
nav.toc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:14px 0}
nav.toc a{display:inline-block;margin:4px 6px 4px 0;padding:8px 12px;font-size:.95rem;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:999px;text-decoration:none}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin:12px 0}
.flow span{background:var(--card);border:2px solid var(--accent);border-radius:10px;padding:12px;font-weight:bold;text-align:center}
.flow i{font-style:normal;font-weight:bold;color:var(--accent);text-align:center;transform:rotate(90deg);line-height:1;font-size:1.2rem}
@media (min-width:560px){.flow{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}.flow i{transform:none}}
#gate{max-width:480px;margin:0 auto;padding:0 0 40px}
#gate .poster{display:block;width:100%;background:#111}
#gate .poster img{display:block;width:100%;max-height:62vh;object-fit:contain;margin:0 auto}
#gate .card{margin:16px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#gate h1{font-size:1.2rem;margin:0 0 6px}
#gate p{color:var(--muted);font-size:.95rem;margin:0 0 6px}
#gate input{width:100%;font-size:1.3rem;text-align:center;padding:12px;border:2px solid var(--line);border-radius:8px;margin:10px 0;background:#fff;color:var(--fg)}
#gate input:focus{outline:3px solid var(--focus);outline-offset:2px}
#gate button{width:100%;font-size:1.05rem;padding:14px;background:var(--accent);color:var(--accent-fg);font-weight:bold;border:0;border-radius:8px}
#msg{color:#b00020;min-height:1.4em;font-size:.95rem}
.top{position:fixed;right:12px;bottom:12px;background:var(--accent);color:var(--accent-fg);border-radius:50%;width:48px;height:48px;font-size:1.3rem;font-weight:bold;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
</style>
</head>

<div id="gate">
  <div class="poster"><img src="poster.jpg" alt="第20回 Halu杯 ポスター"></div>
  <div class="card">
    <h1>🀄 幹部用ページ</h1>
    <p>幹部LINEで共有したパスワードを入れてください。</p>
    <form id="f">

      <button type="submit">開く</button>
    </form>
    <div id="msg"></div>
  </div>
</div>

<script>
const B = JSON.parse(document.getElementById('blob').textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(B.salt), iterations:B.iter}, base, 512));
  const aesKey = await crypto.subtle.importKey('raw', bits.slice(0,32), {name:'AES-CBC'}, false, ['decrypt']);
  const macKey = await crypto.subtle.importKey('raw', bits.slice(32,64), {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  const iv = b64(B.iv), ct = b64(B.ct);
  const joined = new Uint8Array(iv.length + ct.length); joined.set(iv); joined.set(ct, iv.length);
  const ok = await crypto.subtle.verify('HMAC', macKey, b64(B.mac), joined);
  if(!ok) throw new Error('bad');
  const plain = await crypto.subtle.decrypt({name:'AES-CBC', iv}, aesKey, ct);
  return new TextDecoder().decode(plain);
}
function show(htmlText){
  const c = document.getElementById('content');
  c.innerHTML = htmlText;
  const toc = document.getElementById('toc');
  c.querySelectorAll('h2').forEach(h => { const a = document.createElement('a'); a.href = '#' + h.id; a.textContent = h.textContent; toc.appendChild(a); });
  c.querySelectorAll('ul.todo input').forEach(cb => {
    const k = 'halu:' + cb.dataset.k;
    try {
      let v = localStorage.getItem(k);
      if(v === null && cb.dataset.legacy){ v = localStorage.getItem('halu:' + cb.dataset.legacy); if(v !== null) localStorage.setItem(k, v); }
      cb.checked = v === '1';
    } catch(e){}
    cb.addEventListener('change', () => { try { localStorage.setItem(k, cb.checked ? '1' : '0'); } catch(e){} });
  });
  document.getElementById('gate').hidden = true;
  document.getElementById('page').hidden = false;
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value.trim();
  const msg = document.getElementById('msg');
  msg.textContent = '確認中…';
  try { const t = await unlock(pw); try { sessionStorage.setItem('halu:pw', pw); } catch(_){} show(t); }
  catch(err){ msg.textContent = 'パスワードが違います'; }
});
document.getElementById('pw').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('f').requestSubmit(); } });
(async () => { try { const pw = sessionStorage.getItem('halu:pw'); if(pw){ show(await unlock(pw)); } } catch(e){} })();
</script>
