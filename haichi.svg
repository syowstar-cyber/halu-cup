<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 790" width="340" height="790" role="img" aria-labelledby="t d" font-family="-apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic UI','Yu Gothic',Meiryo,sans-serif">
<!-- 麻雀First の卓の配置図（2026-10-17・手書き）。ファースト確認ページ（first/）と参加者案内（sanka/）の両方がこのファイルを使う＝直すのはここだけ。
     入口側から奥（窓）に向かって、左の列が1・2・3・8卓、右の列が受付・4・5・6・7卓。卓は斜め45度。
     組: 本田プロの組＝2・4・7・8卓（赤）、ゆうこママの組＝1・3・5・6卓（青緑）。本田プロと当たらないゆうこママの組を、本田プロが見える近くに置く（主催）。
     予選の席（2卓・5卓のほか）: 入口側の左が東（起家・塗りの丸）、右が南、奥の右が西、奥の左が北（上から見て反時計回り）。
     2卓・5卓: 本田プロ・ゆうこママは入口側の左の席のまま動かない（主催の指示）。風は kuji/kata.js のとおり 1回戦 北・2回戦 西・3回戦 東・4回戦 南で、
     ほかの3人はそこから反時計回りに座る＝下の4つの小さな図。型を変えたら、組の色とこの4つの図も直す -->
<title id="t">麻雀Firstの卓の配置図</title>
<desc id="d">入口側から店の奥（窓）に向かって、左の列に1・2・3・8卓、右の列に受付・4・5・6・7卓。卓は斜めに置く。2卓に本田プロ、5卓にゆうこママ。本田プロの組は2・4・7・8卓、ゆうこママの組は1・3・5・6卓。予選の席は、2卓・5卓のほかは入口側の左が東、右が南、奥の右が西、奥の左が北。2卓・5卓は本田プロ・ゆうこママが入口側の左の席のままで、東南西北は回ごとに変わる。</desc>
