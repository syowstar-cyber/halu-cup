<text x="170" y="310" text-anchor="middle" font-size="11" fill="#9a9a95">通路</text>
<g>
<g transform="translate(100 145) rotate(45)"><rect x="-34" y="-34" width="68" height="68" rx="6" fill="#f6e3e3" stroke="#7a1a1a" stroke-width="1.5"/></g>
<g transform="translate(100 250) rotate(45)"><rect x="-34" y="-34" width="68" height="68" rx="6" fill="#dcf0f1" stroke="#1b6670" stroke-width="1.5"/></g>
