</g>
<g font-weight="700" text-anchor="middle">
<text x="100" y="154" font-size="26" fill="#5c1414">8</text>
<text x="100" y="259" font-size="26" fill="#124a52">3</text>
<text x="100" y="357" font-size="24" fill="#5c1414">2</text><text x="100" y="373" font-size="11" fill="#5c1414">本田プロ</text>
<text x="100" y="469" font-size="26" fill="#124a52">1</text>
