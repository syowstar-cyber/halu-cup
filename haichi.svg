<g transform="translate(240 250) rotate(45)"><rect x="-34" y="-34" width="68" height="68" rx="6" fill="#dcf0f1" stroke="#1b6670" stroke-width="1.5"/></g>
<g transform="translate(240 355) rotate(45)"><rect x="-34" y="-34" width="68" height="68" rx="6" fill="#dcf0f1" stroke="#1b6670" stroke-width="3"/></g>
